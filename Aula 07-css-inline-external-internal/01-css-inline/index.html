<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS inline</title>
</head>
<body> 
    <h1>Demonstração de CSS Inline</h1>
    <p style="color: blue;
     font-size: 24px"> Este parágrafo utiliza CSS inline atraves do atributo style.</p>

    <p style=" color: yellow;
     font-weight: bold;
      background-color: rgb(190, 150, 18); ">Outro parágrafo com múltiplas propriedades CSS inline</p>
     <!-- padding: espaçamento interno/ margin: espaçamento externo -->
     <div style="border: 2px solid green;
      width: 400px;
      padding: 30px;
      margin: 50px;">Esta é uma div estilizada com CSS</div>
      <h2 style="color: blue; text-align: center;">
Título centralizado com cor hexdecimal
      </h2>
      <div style="height: 400px; width: 600px; background-color:  orange; color: white; font-size:  32px;text-align: center;">
        Desafio CSS inline
      </div>
</body>
</html>
