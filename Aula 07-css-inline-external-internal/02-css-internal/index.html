<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS internal</title>
<!-- Aqui vai o CSS interno -->
<style>
    p{color: #f87575;
    font-size: 18px;}
    .destaque{
        background-color: #4423bb;
        color: aquamarine;
        padding: 10px;
        border-left: 4px solid orange;
    }
    #principal{
        border: 2px solid orange;
        padding: 20px;
        margin: 20px;
    }
    #titulosecao{
        color: purple;
    }
</style>
<body>
    <h1> Demonstração de CSS internal</h1>
    <p>Este parágrafo é estilizado
        <br> através do CSS internal, definido no head.

    </p>
    <p class="destaque">
        Este parágrafo possui uma classe(.) "destaque" e recebe estilos específicos.
    </p>
    <div>  
         <section id="principal">
            <h2 id="titulosecao"> Seção principal</h2>
            <p style="color: grey;">Esta seção posui o ID(#) "principal" é estilizado de forma única.</p>
       </section>
    </div>
</body>
</html>
